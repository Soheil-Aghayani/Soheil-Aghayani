<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soheil Aghayani - research, systems, curiosity</title>
  <desc id="desc">An abstract landscape that connects environmental research with software systems, featuring a sprouting plant on the lower right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#092A31"/>
      <stop offset="0.58" stop-color="#124A51"/>
      <stop offset="1" stop-color="#D9784A"/>
    </linearGradient>
    <linearGradient id="sun" x1="910" y1="38" x2="1100" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D58B"/>
      <stop offset="1" stop-color="#E5A24B"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="230" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082329"/>
      <stop offset="1" stop-color="#0F3940"/>
    </linearGradient>
    <filter id="glow" x="-80" y="-80" width="360" height="360" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <style>
      @keyframes rise-in {
        from { transform: translateY(12px); }
        to { transform: translateY(0); }
      }
      @keyframes scale-in {
        from { transform: scale(0.88); }
        to { transform: scale(1); }
      }
      @keyframes orbit-forward {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbit-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .motion-rise {
        animation: rise-in 850ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .motion-rise-late {
        animation: rise-in 850ms cubic-bezier(0.16, 1, 0.3, 1) 260ms both;
      }
      .motion-scale {
        transform-box: fill-box;
        transform-origin: center;
        animation: scale-in 1050ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .orbit-motion,
      .orbit-motion-reverse {
        transform-box: view-box;
        transform-origin: 1020px 112px;
      }
      .orbit-motion {
        animation: orbit-forward 18s linear infinite;
      }
      .orbit-motion-reverse {
        animation: orbit-reverse 27s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .motion-rise,
        .motion-rise-late,
        .motion-scale,
        .orbit-motion,
        .orbit-motion-reverse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="112" r="112" fill="#F8D58B" opacity="0.18" filter="url(#glow)" class="motion-scale"/>
  <g fill="none" stroke-width="1.5" class="motion-rise">
    <circle cx="1020" cy="112" r="138" stroke="#F8D58B" opacity="0.28"/>
    <circle cx="1020" cy="112" r="176" stroke="#B8E3DD" opacity="0.2"/>
  </g>
  <circle cx="1020" cy="112" r="76" fill="url(#sun)" opacity="0.92" class="motion-scale"/>
  <g class="orbit-motion">
    <circle cx="1158" cy="112" r="5" fill="#9CD8D1"/>
  </g>
  <g class="orbit-motion-reverse">
    <circle cx="1196" cy="112" r="4" fill="#F8D58B"/>
  </g>

  <g opacity="0.22" stroke="#C4EEF0" stroke-width="1" class="motion-rise">
    <path d="M48 68H530"/>
    <path d="M48 102H430"/>
    <path d="M48 136H340"/>
    <path d="M720 52V214"/>
    <path d="M760 52V214"/>
    <path d="M800 52V214"/>
    <path d="M840 52V214"/>
    <path d="M880 52V214"/>
  </g>

  <path d="M0 260C124 210 202 224 318 262C430 298 522 216 643 242C772 269 842 222 950 244C1047 264 1108 220 1200 204V360H0V260Z" fill="url(#ridge)" class="motion-rise"/>
  <path d="M0 298C124 267 230 279 337 311C461 348 545 273 655 292C785 315 862 276 972 291C1070 305 1128 279 1200 267V360H0V298Z" fill="#061B21" opacity="0.8" class="motion-rise-late"/>

  <!-- Plant sprouting from the bottom right ground -->
  <g opacity="0.85" class="motion-rise-late" fill="#9CD8D1">
    <!-- Main stem -->
    <path d="M1160 360 Q 1150 280, 1120 200" fill="none" stroke="#9CD8D1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Side branch -->
    <path d="M1150 290 Q 1175 250, 1185 210" fill="none" stroke="#9CD8D1" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Leaves on main stem (Left side) -->
    <path d="M1153 330 Q 1135 325, 1135 335 Q 1145 345, 1153 330Z" />
    <path d="M1143 280 Q 1120 275, 1120 285 Q 1135 295, 1143 280Z" />
    <path d="M1132 235 Q 1110 230, 1110 240 Q 1120 250, 1132 235Z" />
    
    <!-- Leaves on main stem (Right side) -->
    <path d="M1147 305 Q 1165 295, 1170 305 Q 1160 315, 1147 305Z" />
    <path d="M1137 255 Q 1155 245, 1160 255 Q 1150 265, 1137 255Z" />
    
    <!-- Leaves on branch -->
    <path d="M1165 260 Q 1185 250, 1190 260 Q 1180 270, 1165 260Z" />
    <path d="M1178 225 Q 1195 215, 1198 225 Q 1188 235, 1178 225Z" />
    
    <!-- Top leaf -->
    <path d="M1120 200 Q 1110 185, 1115 180 Q 1125 190, 1120 200Z" />
  </g>

  <g fill="#F8D58B" class="motion-rise">
    <circle cx="650" cy="86" r="4"/>
    <circle cx="680" cy="118" r="3"/>
    <circle cx="708" cy="76" r="2"/>
    <circle cx="744" cy="144" r="4"/>
    <circle cx="786" cy="92" r="2"/>
  </g>

  <g fill="#F5F1E9" font-family="Arial, Helvetica, sans-serif" class="motion-rise-late">
    <text x="70" y="92" font-size="18" letter-spacing="5" fill="#B8E3DD">SOHEIL AGHAYANI</text>
    <text x="70" y="148" font-size="42" font-weight="700" letter-spacing="1">RESEARCH</text>
    <text x="70" y="193" font-size="42" font-weight="700" letter-spacing="1">INTO SYSTEMS</text>
    <text x="70" y="232" font-size="16" letter-spacing="2" fill="#F8D58B">ENVIRONMENT · SOFTWARE · HUMAN CURIOSITY</text>
  </g>

  <g transform="translate(862 246)" fill="none" stroke="#F5F1E9" stroke-width="2" opacity="0.78" class="motion-rise-late">
    <rect width="248" height="62" rx="14"/>
    <text x="124" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#B8E3DD" stroke="none" text-anchor="middle" dominant-baseline="middle">IDEAS → TOOLS</text>
  </g>
</svg>
